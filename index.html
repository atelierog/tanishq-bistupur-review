<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>Tanishq Bistupur — Genuine Review Assistant</title>
<style>
:root{color-scheme:light;--black:#111;--white:#fff;--muted:#666;--line:#dedede;--soft:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--black);font:16px/1.5 Arial,Helvetica,sans-serif}
main{width:min(100% - 28px,560px);margin:auto;padding:28px 0 42px}
.brand{text-align:center;padding:16px 8px 25px}
.brand-name{font:700 38px/1 Georgia,serif;letter-spacing:4px;color:#111}
.place{font-size:13px;letter-spacing:4px;margin-top:9px;color:#111}
.eyebrow{font-size:11px;letter-spacing:3px;color:#555;margin-top:15px;font-weight:700}
.panel{background:#fff;border:1px solid #dedede;border-radius:20px;padding:23px;box-shadow:0 12px 32px #0000000d}
h1{font:400 29px/1.18 Georgia,serif;text-align:center;margin:0 0 10px;color:#111}
label{display:block;font-size:13px;font-weight:700;color:#111;margin:0 0 8px}
textarea{display:block;width:100%;min-height:142px;resize:vertical;border:1px solid #ccc;border-radius:13px;background:#fff;color:#111;padding:15px;font:16px/1.55 Arial,sans-serif;outline:none}
textarea:focus,[contenteditable=true]:focus{border-color:#111;box-shadow:0 0 0 2px #11111118}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 8px}
.seg{display:flex;gap:5px;padding:4px;border:1px solid #ccc;border-radius:999px;background:#fff}
.seg button{border:0;background:transparent;color:#555;padding:8px 13px;border-radius:999px;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:#111;color:#fff}
button,.link{font:700 14px Arial,sans-serif;cursor:pointer}
.primary{width:100%;border:0;border-radius:12px;padding:15px;background:#111;color:#fff;margin-top:16px}
.primary:disabled{opacity:.6;cursor:wait}
.secondary{border:1px solid #111;background:#fff;color:#111;border-radius:12px;padding:12px 14px}
.status{font-size:12px;color:#666;margin-top:10px;min-height:18px}
.draft-wrap{margin-top:22px;border-top:1px solid #e5e5e5;padding-top:20px}
.draft{white-space:pre-wrap;min-height:110px;background:#fafafa;border:1px solid #ccc;border-radius:13px;padding:15px;outline:none;color:#111;font:16px/1.6 Georgia,serif}
.draft:empty:before{content:"Your improved wording will appear here.";color:#888}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.actions .primary{margin:0;grid-column:1/-1}
.actions a{display:flex;align-items:center;justify-content:center;text-decoration:none}
.error{color:#a32020}.ok{color:#216b36}
.counter{font-size:11px;color:#666;white-space:nowrap}
@media(max-width:390px){main{width:min(100% - 20px,560px);padding-top:14px}.panel{padding:18px}.brand-name{font-size:34px}h1{font-size:26px}.seg button{padding:8px 10px}}
</style></head><body><main>
<header class="brand"><div class="brand-name">TANISHQ</div><div class="place">BISTUPUR · JAMSHEDPUR</div><div class="eyebrow">CUSTOMER REVIEW ASSISTANT</div></header>
<section class="panel" aria-labelledby="heading"><h1 id="heading">Share your real experience</h1>
<label for="experience">What actually happened during your visit?</label>
<textarea id="experience" maxlength="1200" placeholder="Example: The gemologist showed me how the diamond checking machine works. I understood the process better."></textarea>
<div class="row"><span class="counter" id="inputCount">0 / 1,200</span><span class="counter">English</span></div>
<button class="primary" id="improve">Improve my wording</button><div class="status" id="status" role="status" aria-live="polite"></div>
<div class="draft-wrap"><div class="row"><label for="draft" style="margin:0">Your review draft</label><span class="counter" id="draftCount">0 characters</span></div>
<div id="draft" class="draft" contenteditable="true" role="textbox" aria-label="Editable review draft" aria-multiline="true" spellcheck="true"></div>
<div class="actions"><button class="secondary" id="copy">Copy review</button><a class="secondary" id="google" href="https://maps.app.goo.gl/gABNBbwhV4eW7Mnd8?g_st=ac" target="_blank" rel="noopener noreferrer">Open Google Reviews ↗</a></div></div></section></main>
<script>
/* Optional AI integration: define window.DXC_AI_ENDPOINT as a same-origin HTTPS endpoint before this script.
POST JSON {text,language,instruction}; return JSON {text}. The service must preserve facts and sentiment,
add no claims, and avoid storing customer text. When absent or unavailable, local cleanup is used. */
window.DXC_AI_ENDPOINT="https://tanishq-qr-ai-review.atelierog-co.workers.dev/rewrite";
const $=id=>document.getElementById(id),input=$("experience"),draft=$("draft"),status=$("status");const language="en";
function setStatus(m,k=""){status.textContent=m;status.className="status "+k}
function count(){$("inputCount").textContent=input.value.length+" / 1,200";$("draftCount").textContent=draft.innerText.trim().length+" characters"}
input.addEventListener("input",count);draft.addEventListener("input",count);
function polishOffline(raw){let t=raw.replace(/\r/g," ").replace(/[\t ]+/g," ").replace(/\n{3,}/g,"\n\n").trim();return t.split(/(?<=[.!?।])\s+/u).map(s=>{s=s.trim();if(!s)return"";s=s.replace(/^([a-z])/u,m=>m.toUpperCase());if(!/[.!?।]$/.test(s))s+=".";return s}).join(" ")}
async function improve(){const original=input.value.trim();if(original.length<5){setStatus("Please write a little about what actually happened first.","error");input.focus();return}
const btn=$("improve");btn.disabled=true;btn.textContent="Working…";
try{if(window.DXC_AI_ENDPOINT){try{const res=await fetch(window.DXC_AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:original,language,instruction:"Rewrite into the English and improve grammar and clarity. Preserve every fact and the original positive, neutral or negative sentiment. Do not add praise, details, claims, names or services, and do not remove criticism. Return only the rewritten review."})});if(!res.ok)throw Error("AI endpoint returned "+res.status);const data=await res.json();if(typeof data.text!=="string"||!data.text.trim())throw Error("Invalid AI response");draft.textContent=data.text.trim();setStatus("AI-assisted wording is ready. Please check it carefully.","ok")}catch(e){draft.textContent=polishOffline(original);setStatus("AI is temporarily unavailable or the free daily allowance is exhausted; your wording was cleaned up offline instead.")}}else{draft.textContent=polishOffline(original);setStatus("Offline wording cleanup complete. AI service was not used.","ok")}}
finally{btn.disabled=false;btn.textContent="Improve my wording";count()}}
$("improve").addEventListener("click",improve);
$("copy").addEventListener("click",async()=>{const t=draft.innerText.trim();if(!t){setStatus("There is no review to copy yet.","error");return}try{await navigator.clipboard.writeText(t);setStatus("Copied. You can paste it into Google Reviews.","ok")}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();setStatus(ok?"Copied. You can paste it into Google Reviews.":"Copy was blocked. Select the draft and copy it manually.",ok?"ok":"error")}});
count();
</script></body></html>
