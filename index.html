<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>Tanishq Bistupur — Genuine Review Assistant</title>
<style>
:root{color-scheme:light;--black:#111;--white:#fff;--muted:#666;--line:#dedede;--soft:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--black);font:16px/1.5 Arial,Helvetica,sans-serif}
main{width:min(100% - 28px,560px);margin:auto;padding:28px 0 42px}
.brand{text-align:center;padding:16px 8px 25px}
.brand-name{font:700 38px/1 Georgia,serif;letter-spacing:4px;color:#111}
.place{font-size:13px;letter-spacing:4px;margin-top:9px;color:#111}
.eyebrow{font-size:11px;letter-spacing:3px;color:#555;margin-top:15px;font-weight:700}
.panel{background:#fff;border:1px solid #dedede;border-radius:20px;padding:23px;box-shadow:0 12px 32px #0000000d}
h1{font:400 29px/1.18 Georgia,serif;text-align:center;margin:0 0 10px;color:#111}
label{display:block;font-size:13px;font-weight:700;color:#111;margin:0 0 8px}
textarea{display:block;width:100%;min-height:142px;resize:vertical;border:1px solid #ccc;border-radius:13px;background:#fff;color:#111;padding:15px;font:16px/1.55 Arial,sans-serif;outline:none}
textarea:focus,[contenteditable=true]:focus{border-color:#111;box-shadow:0 0 0 2px #11111118}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 8px}
.seg{display:flex;gap:5px;padding:4px;border:1px solid #ccc;border-radius:999px;background:#fff}
.seg button{border:0;background:transparent;color:#555;padding:8px 13px;border-radius:999px;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:#111;color:#fff}
button,.link{font:700 14px Arial,sans-serif;cursor:pointer}
/* Keep mobile tap/focus feedback strictly monochrome */
/* Force monochrome interaction feedback on Android/iOS browsers */
*,*::before,*::after{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}
button,a,.link,[role="button"],input,textarea,select{accent-color:#111!important;outline-color:#111!important}
button:focus,button:focus-visible,button:active,a:focus,a:focus-visible,a:active,.link:focus,.link:focus-visible,.link:active,[role="button"]:focus,[role="button"]:active,input:focus,textarea:focus,select:focus{outline:2px solid #111!important;outline-offset:2px;box-shadow:none!important}
button:active,.link:active,a:active,[role="button"]:active{background-color:#111!important;color:#fff!important;filter:none!important}
.choice[aria-pressed="true"],.seg button[aria-pressed="true"]{background:#111!important;color:#fff!important;border-color:#111!important}
button:disabled{opacity:.55;cursor:not-allowed}

.primary{width:100%;border:0;border-radius:12px;padding:15px;background:#111;color:#fff;margin-top:16px}
.primary:disabled{opacity:.6;cursor:wait}
.secondary{border:1px solid #111;background:#fff;color:#111;border-radius:12px;padding:12px 14px}
.status{font-size:12px;color:#666;margin-top:10px;min-height:18px}
.help-trigger{display:block;width:100%;margin-top:10px;padding:11px;border:1px solid #bbb;border-radius:12px;background:#fff;color:#111}
.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal-backdrop.open{display:flex}
.modal{width:min(100%,430px);background:#fff;border:1px solid #e7e7e7;border-radius:24px;padding:22px;box-shadow:0 20px 70px #0005}
.modal h2{font:400 27px/1.15 Georgia,serif;margin:0 0 7px;text-align:center;letter-spacing:-.3px}
.modal-sub{font-size:13px;color:#666;text-align:center;margin:0 auto 18px;max-width:290px}
.choice-title{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#666;margin:17px 0 9px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choice{border:1px solid #d8d8d8;background:#fff;color:#222;border-radius:12px;padding:13px 9px;font-size:13px;min-height:48px;transition:background .15s,border-color .15s}
.choice[aria-pressed=true]{background:#111;color:#fff;border-color:#111}
.detail-label{display:block;font-size:13px;font-weight:700;margin:17px 0 7px}
.detail-input{width:100%;border:1px solid #ccc;border-radius:11px;padding:12px;font:15px Arial,sans-serif;color:#111;outline:none}
.detail-input:focus{border-color:#111;box-shadow:0 0 0 2px #11111118}
.modal-actions{display:flex;gap:9px;margin-top:18px}
.modal-actions button{flex:1;margin:0}
.modal-close{display:block;margin:8px auto 0;background:none;border:0;color:#666;padding:8px}
@keyframes review-cursor{50%{opacity:0}}
.draft.typing:after{content:"▍";animation:review-cursor .8s infinite}
.draft-wrap{margin-top:22px;border-top:1px solid #e5e5e5;padding-top:20px}
.draft{white-space:pre-wrap;min-height:110px;background:#fafafa;border:1px solid #ccc;border-radius:13px;padding:15px;outline:none;color:#111;font:16px/1.6 Georgia,serif}
.draft:empty:before{content:"Your improved wording will appear here.";color:#888}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.actions .primary{margin:0;grid-column:1/-1}
.actions a{display:flex;align-items:center;justify-content:center;text-decoration:none}
.error{color:#a32020}.ok{color:#216b36}
.counter{font-size:11px;color:#666;white-space:nowrap}
@media(max-width:390px){main{width:min(100% - 20px,560px);padding-top:14px}.panel{padding:18px}.brand-name{font-size:34px}h1{font-size:26px}.seg button{padding:8px 10px}}
</style></head><body><main>
<header class="brand"><div class="brand-name">TANISHQ</div><div class="place">BISTUPUR · JAMSHEDPUR</div><div class="eyebrow">CUSTOMER REVIEW ASSISTANT</div></header>
<section class="panel" aria-labelledby="heading"><h1 id="heading">Share your real experience</h1>
<label for="experience">What actually happened during your visit?</label>
<textarea id="experience" maxlength="1200" placeholder="Example: The gemologist showed me how the diamond checking machine works. I understood the process better."></textarea>
<div class="row"><span class="counter" id="inputCount">0 / 1,200</span><span class="counter">English</span></div>
<button class="primary" id="improve">Improve my wording</button><button class="help-trigger" id="helpOpen" type="button">Help me write</button><div class="status" id="status" role="status" aria-live="polite"></div>
<div class="draft-wrap"><div class="row"><label for="draft" style="margin:0">Your review draft</label><span class="counter" id="draftCount">0 characters</span></div>
<div id="draft" class="draft" contenteditable="true" role="textbox" aria-label="Editable review draft" aria-multiline="true" spellcheck="true"></div>
<div class="actions"><button class="secondary" id="copy">Copy review</button><a class="secondary" id="google" href="https://maps.app.goo.gl/gABNBbwhV4eW7Mnd8?g_st=ac" target="_blank" rel="noopener noreferrer">Open Google Reviews ↗</a></div></div></section>
<div class="modal-backdrop" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
 <div class="modal">
  <h2 id="helpTitle">Let’s create your review</h2>
  <p class="modal-sub">Choose what stood out. Add a name or detail if you like.</p>
  <div class="choice-title">Choose a topic</div>
  <div class="choices" id="topicChoices">
   <button class="choice" type="button" data-topic="Staff and service">Staff &amp; service</button>
   <button class="choice" type="button" data-topic="Diamond demonstration">Diamond demo</button>
   <button class="choice" type="button" data-topic="Product guidance">Product guidance</button>
   <button class="choice" type="button" data-topic="Jewellery designs">Jewellery designs</button>
   <button class="choice" type="button" data-topic="Billing experience">Billing</button>
   <button class="choice" type="button" data-topic="Overall store visit">Store visit</button>
  </div>
  <label class="detail-label" for="helpDetail">Add a name or detail <span style="font-weight:400;color:#777">(optional)</span></label>
  <input class="detail-input" id="helpDetail" type="text" maxlength="160" placeholder="e.g. Amit helped me understand diamond quality">
  <div class="modal-actions"><button class="secondary" id="helpCancel" type="button">Cancel</button><button class="primary" id="helpCreate" type="button" disabled>Create my review</button></div>
 </div>
</div></main>
<script>
/* Optional AI integration: define window.DXC_AI_ENDPOINT as a same-origin HTTPS endpoint before this script.
POST JSON {text,language,instruction}; return JSON {text}. The service must preserve facts and sentiment,
add no claims, and avoid storing customer text. When absent or unavailable, local cleanup is used. */
window.DXC_AI_ENDPOINT="https://tanishq-qr-ai-review.atelierog-co.workers.dev/rewrite";
const $=id=>document.getElementById(id),input=$("experience"),draft=$("draft"),status=$("status");const language="en";
let chosenTopic="";
const modal=$("helpModal");
$("helpOpen").addEventListener("click",()=>{chosenTopic="";$("helpDetail").value="";document.querySelectorAll("[data-topic]").forEach(x=>x.setAttribute("aria-pressed","false"));$("helpCreate").disabled=true;modal.classList.add("open")});
$("helpCancel").addEventListener("click",()=>modal.classList.remove("open"));
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});
document.querySelectorAll("[data-topic]").forEach(b=>b.addEventListener("click",()=>{chosenTopic=b.dataset.topic;document.querySelectorAll("[data-topic]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("helpCreate").disabled=false}));
$("helpCreate").addEventListener("click",()=>{if(!chosenTopic)return;const detail=$("helpDetail").value.trim();input.value=detail;count();modal.classList.remove("open");improve(chosenTopic)});

function setStatus(m,k=""){status.textContent=m;status.className="status "+k}
function count(){$("inputCount").textContent=input.value.length+" / 1,200";$("draftCount").textContent=draft.innerText.trim().length+" characters"}
input.addEventListener("input",count);draft.addEventListener("input",count);
function animateWords(text){return new Promise(resolve=>{const words=text.split(/\s+/);let i=0;draft.textContent="";draft.classList.add("typing");function next(){if(i<words.length){draft.textContent+=(i?" ":"")+words[i++];count();setTimeout(next,70)}else{draft.classList.remove("typing");resolve()}}next()})}
function polishOffline(raw){let t=raw.replace(/\r/g," ").replace(/[\t ]+/g," ").replace(/\n{3,}/g,"\n\n").trim();return t.split(/(?<=[.!?।])\s+/u).map(s=>{s=s.trim();if(!s)return"";s=s.replace(/^([a-z])/u,m=>m.toUpperCase());if(!/[.!?।]$/.test(s))s+=".";return s}).join(" ")}
async function improve(topic=""){const original=input.value.trim();if(!topic&&original.length<5){setStatus("Please write a little about what actually happened first.","error");input.focus();return}
const btn=$("improve");btn.disabled=true;btn.textContent="Working…";
try{if(window.DXC_AI_ENDPOINT){try{const res=await fetch(window.DXC_AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:original,topic,language,instruction:"Write a natural, polished English customer review in 2–3 complete sentences, around 25–45 words. Use the selected topic and customer detail as the source. If a name is supplied, include it naturally and spell it exactly. Improve short phrases into a complete review instead of merely repeating them. You may express the same sentiment in fuller, natural wording, but do not invent specific actions, conversations, products, outcomes or events. If only a topic is selected, keep the review general and do not invent a positive or negative opinion. Preserve any criticism. Return only the review."})});if(!res.ok)throw Error("AI endpoint returned "+res.status);const data=await res.json();if(typeof data.text!=="string"||!data.text.trim())throw Error("Invalid AI response");await animateWords(data.text.trim());setStatus("Review ready. Please check it carefully.","ok")}catch(e){await animateWords(polishOffline(original));setStatus("AI is unavailable; basic wording cleanup was used instead.")}}else{await animateWords(polishOffline(original));setStatus("Offline wording cleanup complete.","ok")}}
finally{btn.disabled=false;btn.textContent="Improve my wording";count()}}
$("improve").addEventListener("click",improve);
$("copy").addEventListener("click",async()=>{const t=draft.innerText.trim();if(!t){setStatus("There is no review to copy yet.","error");return}try{await navigator.clipboard.writeText(t);setStatus("Copied. You can paste it into Google Reviews.","ok")}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();setStatus(ok?"Copied. You can paste it into Google Reviews.":"Copy was blocked. Select the draft and copy it manually.",ok?"ok":"error")}});
count();
</script></body></html>
